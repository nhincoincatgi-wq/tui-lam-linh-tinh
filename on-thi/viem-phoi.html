in","Cefixim"],"why":"Theo Nhi ALL-2.docx: Clindamycin.","mode":"theory","id":"vp214","key":214},{"t":7,"q":"MRSA kháng cả clindamycin: ưu tiên IV?","choices":["Vancomycin","Clindamycin","Oxacillin","Azithromycin"],"why":"Theo Nhi ALL-2.docx: Vancomycin.","mode":"theory","id":"vp215","key":215},{"t":7,"q":"MRSA kháng cả clindamycin: ưu tiên uống?","choices":["Linezolid","Clindamycin","Cephalexin","Amoxicillin"],"why":"Theo Nhi ALL-2.docx: Linezolid.","mode":"theory","id":"vp216","key":216},{"t":7,"q":"Nghi thêm tụ cầu, hình trang 11 nêu phối hợp nào?","choices":["Vancomycin hoặc clindamycin + một beta-lactam","Hai beta-lactam bất kỳ","Hai macrolide","Chỉ amoxicillin"],"why":"Theo Nhi ALL-2.docx: Vancomycin hoặc clindamycin + một beta-lactam.","mode":"theory","id":"vp217","key":217},{"t":7,"q":"Nếu vancomycin thất bại trong ghi chú nghi tụ cầu, hướng được nêu?","choices":["Linezolid + beta-lactam","Chỉ ngưng mọi thuốc","Chỉ azithromycin","Chỉ paracetamol"],"why":"Theo Nhi ALL-2.docx: Linezolid + beta-lactam.","mode":"theory","id":"vp218","key":218},{"t":8,"q":"Bốn nguyên tắc điều trị được ghi?","choices":["Chống suy hô hấp, chống nhiễm khuẩn, điều trị rối loạn đi kèm, biến chứng","Chỉ hạ sốt","Chỉ kháng sinh","Chỉ giảm ho"],"why":"Theo Nhi ALL-2.docx: Chống suy hô hấp, chống nhiễm khuẩn, điều trị rối loạn đi kèm, biến chứng.","mode":"theory","id":"vp219","key":219},{"t":8,"q":"Dấu dặn tái khám ngay liên quan hô hấp?","choices":["Rút lõm ngực nặng, tím tái","Ho nhẹ cải thiện","Sổ mũi nhẹ","Ăn tốt"],"why":"Theo Nhi ALL-2.docx: Rút lõm ngực nặng, tím tái.","mode":"theory","id":"vp220","key":220},{"t":8,"q":"Dấu dặn tái khám ngay liên quan tri giác?","choices":["Li bì khó đánh thức, co giật","Tỉnh táo","Ngủ đúng giờ","Chơi bình thường"],"why":"Theo Nhi ALL-2.docx: Li bì khó đánh thức, co giật.","mode":"theory","id":"vp221","key":221},{"t":8,"q":"Dấu dặn tái khám ngay liên quan ăn uống?","choices":["Bỏ bú, nôn tất cả","Ăn tốt","Uống bình thường","Chỉ ăn chậm hơn"],"why":" 262","key":262},{"t":5,"q":"Trẻ 20 kg, paracetamol 10–15 mg/kg/lần: khoảng liều lý thuyết?","choices":["200–300 mg","20–30 mg","400–600 mg","1000 mg"],"why":"Đối chiếu tài liệu: 200–300 mg.","mode":"case","id":"vp263","key":263},{"t":5,"q":"Trẻ 20 kg, Augmentin 600/42,9 mg mỗi 5 mL, 5 mL ×3: amoxicillin mỗi ngày?","choices":["1800 mg","600 mg","1200 mg","2400 mg"],"why":"Đối chiếu tài liệu: 1800 mg.","mode":"case","id":"vp264","key":264},{"t":5,"q":"Cùng trẻ 20 kg dùng 5 mL ×3: acid clavulanic mg/kg/ngày?","choices":["6,435 mg/kg/ngày","12,87 mg/kg/ngày","42,9 mg/kg/ngày","2,145 mg/kg/ngày"],"why":"Đối chiếu tài liệu: 6,435 mg/kg/ngày.","mode":"case","id":"vp265","key":265},{"t":6,"q":"Trẻ 9 kg viêm phổi nhẹ, ceftriaxone 80 mg/kg/ngày theo bảng: tổng lý thuyết?","choices":["720 mg/ngày","900 mg/ngày","800 mg/ngày","180 mg/ngày"],"why":"Đối chiếu tài liệu: 720 mg/ngày.","mode":"case","id":"vp266","key":266},{"t":6,"q":"Trẻ 20 kg viêm phổi nặng, ceftriaxone 100 mg/kg/ngày chia 2: mỗi lần?","choices":["1000 mg","2000 mg","800 mg","500 mg"],"why":"Đối chiếu tài liệu: 1000 mg.","mode":"case","id":"vp267","key":267},{"t":6,"q":"Trẻ 12 kg viêm phổi nặng, ceftriaxone 100 mg/kg/ngày chia 2: mỗi lần?","choices":["600 mg","1200 mg","480 mg","300 mg"],"why":"Đối chiếu tài liệu: 600 mg.","mode":"case","id":"vp268","key":268},{"t":6,"q":"Trẻ cần thở máy. Phân phòng theo file?","choices":["ICU","Phòng ngoài","Ngoại trú","Phòng tiêm"],"why":"Đối chiếu tài liệu: ICU.","mode":"case","id":"vp269","key":269},{"t":6,"q":"Trẻ cần oxy nhưng chưa cần thở máy, theo phân phòng file?","choices":["Cấp cứu","Phòng ngoài bắt buộc","Ngoại trú","Phòng tiêm"],"why":"Đối chiếu tài liệu: Cấp cứu.","mode":"case","id":"vp270","key":270},{"t":7,"q":"Hib beta-lactamase dương, cần đường IV: ưu tiên theo bảng?","choices":["Ceftriaxone/cefotaxim","Ampicillin đơn độc","Amoxicillin uống","Azithromycin đơn độc"],"why":"Đối chiếu tài liệu: Ceftriaxone/cefotaxim.","mode":"case","id":"vp271","key":271},{"t":7,"q":"Phế cầu MIC penicillin 2 µg/mL, dùng đường uống theo bảng đặc hiệu?","choices":["Amoxicillin liều cao","Linezolid bắt buộc","Vancomycin uống","Gentamicin"],"why":"Đối chiếu tài liệu: Amoxicillin liều cao.","mode":"case","id":"vp272","key":272},{"t":7,"q":"Phế cầu MIC penicillin 4 µg/mL, ưu tiên IV theo bảng?","choices":["Ceftriaxone","Penicillin G đơn độc","Amoxicillin uống","Azithromycin"],"why":"Đối chiếu tài liệu: Ceftriaxone.","mode":"case","id":"vp273","key":273},{"t":7,"q":"MSSA xác định nhạy methicillin, ưu tiên IV theo hình?","choices":["Oxacillin","Vancomycin bắt buộc","Linezolid bắt buộc","Cefixim"],"why":"Đối chiếu tài liệu: Oxacillin.","mode":"case","id":"vp274","key":274},{"t":8,"q":"Trẻ đang điều trị IV, hết sốt, cải thiện, uống được, không biến chứng. Có thể xem xét?","choices":["Chuyển sang KS uống","Bắt buộc IV mãi","Ngưng mọi theo dõi","Thở máy"],"why":"Đối chiếu tài liệu: Chuyển sang KS uống.","mode":"case","id":"vp275","key":275},{"t":8,"q":"Trẻ ở nhà xuất hiện tím tái và li bì. Dặn dò?","choices":["Tái khám cấp cứu ngay","Đợi 2 ngày","Đợi hết toa","Chỉ uống thêm nước"],"why":"Đối chiếu tài liệu: Tái khám cấp cứu ngay.","mode":"case","id":"vp276","key":276}];
const $=id=>document.getElementById(id);
const storageKey='nhi-viem-phoi-20261127-v1';
let storageOK=true;
let saved={stats:{},recent:[],light:false};
try{
  const previous=JSON.parse(localStorage.getItem(storageKey));
  if(previous?.stats && Array.isArray(previous.recent)) saved=previous;
  localStorage.setItem(storageKey,JSON.stringify(saved));
}catch{storageOK=false;}
function save(){
  try{localStorage.setItem(storageKey,JSON.stringify(saved));}
  catch{storageOK=false;}
}
function el(tag,value){
  const node=document.createElement(tag);
  if(value!==undefined)node.textContent=value;
  return node;
}
function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}
topics.forEach((name,i)=>{
  const option=el('option',name);
  option.value=i;
  $('topic').append(option);
});
const notes=["Nguồn: Nhi ALL-2.docx, 17 trang, gồm cả hình bảng kháng sinh và xuất viện ở trang 5, 8, 11, 13–15. Các câu hỏi dùng thuật ngữ và mốc của nguồn, không thay phác đồ.","Trang 1 định nghĩa VPCĐ ngoài BV hoặc trong 48 giờ đầu nhập viện; trang 2 lại ghi bệnh trước nhập viện >48h. Không dùng dòng mâu thuẫn trang 2 làm mốc chẩn đoán. Bảng độ nặng bỏ trống SpO₂ 90–91%; không phân độ bằng một dấu đơn độc. X-quang không bắt buộc cho mọi trường hợp ngoại trú.","Bảng nội trú trang 9 ghi azithromycin 10 g/kg (lỗi đơn vị) trong khi trang 12 ghi 10 mg/kg/ngày; các bảng còn có lịch ngày 1–5 khác nhau. Vancomycin ghi hai tổng liều 80 và 40–60 mg/kg/ngày; không chọn một liều chuẩn từ nguồn mâu thuẫn. Levofloxacin 5–16 tuổi ghi 8–10 mg/ngày thiếu đơn vị theo cân nặng. Không dùng các dòng này để kê đơn.","Ví dụ pha ceftriaxone trang 9 và ca trang 16 khác nhau về thể tích. Ghi chú ampicillin/penicillin G không hiệu quả ở VN không phải khẳng định chung cho mọi chủng; bảng đặc hiệu vẫn chọn thuốc theo MIC. Các lựa chọn dị ứng beta-lactam phải xét loại phản ứng. Kháng sinh và liều trong đề chỉ để đối chiếu bài giảng, cần kiểm tra tuổi, thận, kháng sinh đồ và phác đồ.","Bảng không điển hình ghi khởi đầu đột ngột nhưng ghi chú dưới lại mô tả từ từ. Không dùng riêng kiểu khởi phát để phân biệt. Một số ghi chú cuối file chưa hoàn chỉnh (SIRS, ngày sốt, liều rời), không tạo đáp án chắc chắn từ chúng."];notes.forEach(n=>$('reference').append(el('p',n)));
function theme(){
  document.documentElement.classList.toggle('light',saved.light);
  $('theme').textContent=saved.light?'Giao diện tối':'Giao diện sáng';
}
$('theme').onclick=()=>{saved.light=!saved.light;save();theme();};
theme();
let mode="theory";
let round=[],position=0,pending=[],repeated=new Set(),missed=[],correct=0,answered=false,baseCount=0,reviewCount=0,current;
const weak=id=>saved.stats[id]?.debt||0;
function inScope(q){
  return q.mode===mode&&($('topic').value===''||String(q.t)===$('topic').value);
}
function switchMode(value){
  mode=value;
  $('theory').setAttribute('aria-pressed',String(mode==='theory'));
  $('cases').setAttribute('aria-pressed',String(mode==='case'));
  $('phase').textContent=mode==='theory'
    ? 'Mỗi câu hỏi một ý trong tài liệu. Chọn Toàn bộ để rà đủ nội dung đã soạn.'
    : 'Áp dụng lý thuyết vào phân độ, tác nhân, chỉ định nhập viện và tính liều theo ví dụ.';
  $('length').value=mode==='theory'?'all':'20';
  buildRound(false);
}
function status(){
  const count=bank.filter(inScope).length;
  $('status').textContent=count+' câu trong phạm vi chọn · '+new Set(bank.filter(q=>inScope(q)&&weak(q.id)>0).map(q=>q.id)).size+' mốc cần ôn lại'+(storageOK?'':' · Tiến độ chỉ lưu trong phiên này');
}
function buildRound(review){
  const pool=shuffle(bank.filter(q=>inScope(q)&&(!review||weak(q.id)>0)));
  if(!pool.length){
    $('status').textContent='Chưa có mốc hay sai trong chủ đề đang chọn.';
    return;
  }
  const recent=new Set(saved.recent);
  const groups=new Map();
  pool.forEach(q=>{
    if(!groups.has(q.id))groups.set(q.id,[]);
    groups.get(q.id).push(q);
  });
  const ordered=[...groups.values()].sort((a,b)=>weak(b[0].id)-weak(a[0].id));
  const want=$('length').value==='all'?pool.length:Math.min(Number($('length').value),pool.length);
  round=[];
  const used=new Set();
  // Sample each group once before returning to it. Prefer stems absent from the previous round.
  for(const excludeRecent of [true,false]){
    let added=true;
    while(added&&round.length<want){
      added=false;
      for(const group of ordered){
        const q=group.find(item=>!used.has(item.key)&&(!excludeRecent||!recent.has(item.key)));
        if(!q)continue;
        round.push({q,isReview:false});used.add(q.key);added=true;
        if(round.length===want)break;
      }
    }
  }
  saved.recent=round.map(item=>item.q.key);
  save();
  baseCount=round.length;position=0;correct=0;reviewCount=0;pending=[];missed=[];repeated=new Set();
  $('results').hidden=true;
  $('quiz').hidden=false;
  status();
  show(false);
}
function show(focus=true){
  current=round[position];
  answered=false;
  const {q,isReview}=current;
  $('counter').textContent=isReview?'Ôn lại mốc vừa sai':'Câu '+round.slice(0,position+1).filter(x=>!x.isReview).length+' / '+baseCount;
  $('tag').textContent=topics[q.t];
  $('progress').max=baseCount;
  $('progress').value=round.slice(0,position).filter(x=>!x.isReview).length;
  $('question').textContent=q.q;
  $('feedback').hidden=true;
  $('next').hidden=true;
  $('answers').replaceChildren();
  shuffle(q.choices.map((value,i)=>({value,isCorrect:i===0}))).forEach(({value,isCorrect},i)=>{
    const button=el('button');
    button.type='button';
    button.append(el('b','ABCD'[i]),el('span',value));
    button.dataset.correct=String(isCorrect);
    button.onclick=()=>answer(button);
    $('answers').append(button);
  });
  if(focus)$('question').focus();
}
function answer(button){
  if(answered)return;
  answered=true;
  const {q,isReview}=current;
  const hit=button.dataset.correct==='true';
  const item=saved.stats[q.id]||{debt:0};
  item.debt=hit?Math.max(0,item.debt-1):Math.min(6,item.debt+2);
  saved.stats[q.id]=item;
  save();
  status();
  if(!isReview&&hit)correct++;
  if(isReview&&hit)reviewCount++;
  if(!hit){
    missed.push({q,chosen:button.lastChild.textContent});
    if(!repeated.has(q.id)){
      repeated.add(q.id);
      const unavailable=new Set([...round.map(item=>item.q.key),...pending.map(item=>item.q.key)]);
      const alternatives=shuffle(bank.filter(other=>other.mode===mode&&other.id===q.id&&other.key!==q.key));
      const practice=alternatives.find(other=>!unavailable.has(other.key))||alternatives[0]||q;
      pending.push({q:practice,isReview:true,due:position+4});
    }
  }
  [...$('answers').children].forEach(option=>{
    option.disabled=true;
    if(option.dataset.correct==='true')option.classList.add('right');
    else if(option===button)option.classList.add('wrong');
  });
  $('feedback').replaceChildren(el('strong',hit?'Đúng rồi':'Chưa đúng · '+q.choices[0]),el('p',q.why));
  $('feedback').hidden=false;
  $('next').textContent=position===round.length-1&&!pending.length?'Xem kết quả':'Câu tiếp';
  $('next').hidden=false;
}
function next(){
  if(!answered)return;
  const i=pending.findIndex(item=>item.due<=position+1);
  if(i>=0||position===round.length-1&&pending.length){
    const [item]=pending.splice(i<0?0:i,1);
    round.splice(position+1,0,item);
  }
  position++;
  if(position<round.length){show();return;}
  $('quiz').hidden=true;
  $('results').hidden=false;
  const heading=el('h2',correct+'/'+baseCount+' câu đúng trong đề');
  heading.tabIndex=-1;
  $('results').replaceChildren(heading,el('p','Lượt ôn xen kẽ: '+reviewCount+'/'+(round.length-baseCount)+' câu đúng.'));
  if(missed.length){
    const details=el('details');
    details.append(el('summary','Xem '+missed.length+' lượt trả lời sai'));
    missed.forEach(({q,chosen})=>details.append(el('h2',q.q),el('p','Em chọn: '+chosen+' · Đáp án: '+q.choices[0]),el('p',q.why)));
    $('results').append(details);
  }
  const again=el('button','Làm đề mới');
  again.className='primary';
  again.onclick=()=>buildRound(false);
  $('results').append(again);
  if(mode==='theory'){
    const cases=el('button','Sang lượt làm case');
    cases.onclick=()=>switchMode('case');
    $('results').append(cases);
  }
  heading.focus();
}
$('theory').onclick=()=>switchMode('theory');
$('cases').onclick=()=>switchMode('case');
$('start').onclick=()=>buildRound(false);
$('retry').onclick=()=>buildRound(true);
$('topic').onchange=status;
$('next').onclick=next;
document.addEventListener('keydown',event=>{
  if($('quiz').hidden||event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
  if(event.target.closest?.('select,input,textarea,button,summary'))return;
  const key=event.key.toLowerCase();
  if(answered&&key==='enter'){event.preventDefault();next();return;}
  if(answered||!key||key.length!==1)return;
  const index='abcd'.includes(key)?'abcd'.indexOf(key):'1234'.indexOf(key);
  if(index>=0){event.preventDefault();$('answers').children[index].click();}
});
switchMode('theory');
</script></html>
