function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

const notes=["Bài này bám theo Nhi ALL-4.docx, mục Tóm tắt lâm sàng Hen nhi; phân độ cơn cấp của nguồn ghi GINA 2010, không đồng nhất với GINA hiện hành.","Bảng phân độ có chồng lấn tại tăng nhịp thở 50%, bỏ trống SpO₂ đúng 90%, PaO₂ đúng 60 và PaCO₂ đúng 45. Không dùng một dấu đơn độc để quyết định độ nặng; đánh giá toàn trạng và dấu nguy kịch.","Bảng kiểm soát trẻ >5 tuổi ghi triệu chứng ban ngày và dùng SABA >2 lần/ngày; giữ nguyên như tài liệu và đánh dấu cần đối chiếu. File không có bảng chỉ số dự đoán hen, nội dung tiên lượng gần/xa hoặc phác đồ điều trị dự phòng theo bậc; không tự bổ sung.","Methylprednisolon: nguồn ghi 1 mg/kg × 4 lần/ngày TMC và ví dụ 17 mg × 4 ở trẻ 17 kg. Đây là dòng cần kiểm tra lại với phác đồ của khoa trước khi học hoặc kê đơn; không dùng làm câu hỏi liều điều trị chuẩn. Các thông số oxy, ICS, SABA và ipratropium trong đề là thông tin ôn theo tài liệu, không phải y lệnh cá thể hóa.","Tên chế phẩm/hàm lượng và các phép tính được giữ theo ví dụ của file; đối chiếu nhãn thực tế. Không suy diễn chỉ định dùng thuốc từ phép tính. Phần mô tả phản vệ không hàm ý phải chờ triệu chứng xuất hiện theo trình tự."];notes.forEach(n=>$('reference').append(el('p',n)));const source=el('a','Mở tài liệu Hen gốc');source.href='https://docs.google.com/document/d/1TecH_DDZD-1vNBoj7BcSiUEo9yswzBK_/edit';source.target='_blank';source.rel='noopener noreferrer';$('reference').append(source);

}
function switchMode(value){
  mode=value;
  $('theory').setAttribute('aria-pressed',String(mode==='theory'));
  $('cases').setAttribute('aria-pressed',String(mode==='case'));
  $('phase').textContent=mode==='theory'
    ? 'Mỗi câu hỏi một ý trong tài liệu. Chọn Toàn bộ để rà đủ nội dung đã soạn.'
    : 'Áp dụng lý thuyết vào phân độ, kiểm soát hen và tính lượng thuốc theo ví dụ.';
  $('length').value=mode==='theory'?'all':'20';
  buildRound(false);
}
function status(){
  const count=bank.filter(inScope).length;
  $('status').textContent=count+' câu trong phạm vi chọn · '+new Set(bank.filter(q=>inScope(q)&&weak(q.id)>0).map(q=>q.id)).size+' mốc cần ôn lại'+(storageOK?'':' · Tiến độ chỉ lưu trong phiên này');
}
function buildRound(review){
  const pool=shuffle(bank.filter(q=>inScope(q)&&(!review||weak(q.id)>0)));
  if(!pool.length){
    $('status').textContent='Chưa có mốc hay sai trong chủ đề đang chọn.';
    return;
  }
  const recent=new Set(saved.recent);
  const groups=new Map();
  pool.forEach(q=>{
    if(!groups.has(q.id))groups.set(q.id,[]);
    groups.get(q.id).push(q);
  });
  const ordered=[...groups.values()].sort((a,b)=>weak(b[0].id)-weak(a[0].id));
  const want=$('length').value==='all'?pool.length:Math.min(Number($('length').value),pool.length);
  round=[];
  const used=new Set();
  // Sample each group once before returning to it. Prefer stems absent from the previous round.
  for(const excludeRecent of [true,false]){
    let added=true;
    while(added&&round.length<want){
      added=false;
      for(const group of ordered){
        const q=group.find(item=>!used.has(item.key)&&(!excludeRecent||!recent.has(item.key)));
        if(!q)continue;
        round.push({q,isReview:false});used.add(q.key);added=true;
        if(round.length===want)break;
      }
    }
  }
  saved.recent=round.map(item=>item.q.key);
  save();
  baseCount=round.length;position=0;correct=0;reviewCount=0;pending=[];missed=[];repeated=new Set();
  $('results').hidden=true;
  $('quiz').hidden=false;
  status();
  show(false);
}
function show(focus=true){
  current=round[position];
  answered=false;
  const {q,isReview}=current;
  $('counter').textContent=isReview?'Ôn lại mốc vừa sai':'Câu '+round.slice(0,position+1).filter(x=>!x.isReview).length+' / '+baseCount;
  $('tag').textContent=topics[q.t];
  $('progress').max=baseCount;
  $('progress').value=round.slice(0,position).filter(x=>!x.isReview).length;
  $('question').textContent=q.q;
  $('feedback').hidden=true;
  $('next').hidden=true;
  $('answers').replaceChildren();
  shuffle(q.choices.map((value,i)=>({value,isCorrect:i===0}))).forEach(({value,isCorrect},i)=>{
    const button=el('button');
    button.type='button';
    button.append(el('b','ABCD'[i]),el('span',value));
    button.dataset.correct=String(isCorrect);
    button.onclick=()=>answer(button);
    $('answers').append(button);
  });
  if(focus)$('question').focus();
}
function answer(button){
  if(answered)return;
  answered=true;
  const {q,isReview}=current;
  const hit=button.dataset.correct==='true';
  const item=saved.stats[q.id]||{debt:0};
  item.debt=hit?Math.max(0,item.debt-1):Math.min(6,item.debt+2);
  saved.stats[q.id]=item;
  save();
  status();
  if(!isReview&&hit)correct++;
  if(isReview&&hit)reviewCount++;
  if(!hit){
    missed.push({q,chosen:button.lastChild.textContent});
    if(!repeated.has(q.id)){
      repeated.add(q.id);
      const unavailable=new Set([...round.map(item=>item.q.key),...pending.map(item=>item.q.key)]);
      const alternatives=shuffle(bank.filter(other=>other.mode===mode&&other.id===q.id&&other.key!==q.key));
      const practice=alternatives.find(other=>!unavailable.has(other.key))||alternatives[0]||q;
      pending.push({q:practice,isReview:true,due:position+4});
    }
  }
  [...$('answers').children].forEach(option=>{
    option.disabled=true;
    if(option.dataset.correct==='true')option.classList.add('right');
    else if(option===button)option.classList.add('wrong');
  });
  $('feedback').replaceChildren(el('strong',hit?'Đúng rồi':'Chưa đúng · '+q.choices[0]),el('p',q.why));
  $('feedback').hidden=false;
  $('next').textContent=position===round.length-1&&!pending.length?'Xem kết quả':'Câu tiếp';
  $('next').hidden=false;
}
function next(){
  if(!answered)return;
  const i=pending.findIndex(item=>item.due<=position+1);
  if(i>=0||position===round.length-1&&pending.length){
    const [item]=pending.splice(i<0?0:i,1);
    round.splice(position+1,0,item);
  }
  position++;
  if(position<round.length){show();return;}
  $('quiz').hidden=true;
  $('results').hidden=false;
  const heading=el('h2',correct+'/'+baseCount+' câu đúng trong đề');
  heading.tabIndex=-1;
  $('results').replaceChildren(heading,el('p','Lượt ôn xen kẽ: '+reviewCount+'/'+(round.length-baseCount)+' câu đúng.'));
  if(missed.length){
    const details=el('details');
    details.append(el('summary','Xem '+missed.length+' lượt trả lời sai'));
    missed.forEach(({q,chosen})=>details.append(el('h2',q.q),el('p','Em chọn: '+chosen+' · Đáp án: '+q.choices[0]),el('p',q.why)));
    $('results').append(details);
  }
  const again=el('button','Làm đề mới');
  again.className='primary';
  again.onclick=()=>buildRound(false);
  $('results').append(again);
  if(mode==='theory'){
    const cases=el('button','Sang lượt làm case');
    cases.onclick=()=>switchMode('case');
    $('results').append(cases);
  }
  heading.focus();
}
$('theory').onclick=()=>switchMode('theory');
$('cases').onclick=()=>switchMode('case');
$('start').onclick=()=>buildRound(false);
$('retry').onclick=()=>buildRound(true);
$('topic').onchange=status;
$('next').onclick=next;
document.addEventListener('keydown',event=>{
  if($('quiz').hidden||event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
  if(event.target.closest?.('select,input,textarea,button,summary'))return;
  const key=event.key.toLowerCase();
  if(answered&&key==='enter'){event.preventDefault();next();return;}
  if(answered||!key||key.length!==1)return;
  const index='abcd'.includes(key)?'abcd'.indexOf(key):'1234'.indexOf(key);
  if(index>=0){event.preventDefault();$('answers').children[index].click();}
});
switchMode('theory');
</script></html>
