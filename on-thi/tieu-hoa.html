},{"t":1,"q":"Trong nhóm tiêu nhiều, cần bao nhiêu trong 3 tiêu chuẩn về lượng/tần suất?","choices":["≥1","≥2","Đủ 3","Không cần tiêu chuẩn"],"why":"Theo TCC.docx: ≥1.","mode":"theory","key":49,"id":"q49"},{"t":2,"q":"Dấu ngoại biên gợi ý sốc trong tài liệu?","choices":["Chi lạnh","Chi ấm đơn độc","Mắt đỏ","Ho khan"],"why":"Theo TCC.docx: Chi lạnh.","mode":"theory","key":50,"id":"q50"},{"t":2,"q":"Biểu hiện bài niệu gợi ý sốc?","choices":["Thiểu niệu hoặc vô niệu","Đa niệu","Tiểu như thường","Tiểu trong không triệu chứng"],"why":"Theo TCC.docx: Thiểu niệu hoặc vô niệu.","mode":"theory","key":51,"id":"q51"},{"t":2,"q":"Biểu hiện toàn thân được liệt kê gợi ý sốc?","choices":["Vã mồ hôi","Ngứa da","Chảy mũi","Đau họng"],"why":"Theo TCC.docx: Vã mồ hôi.","mode":"theory","key":52,"id":"q52"},{"t":2,"q":"Những thông số cần chú ý để phát hiện sớm sốc theo tài liệu?","choices":["Nhiệt độ, mạch, CRT","Chỉ cân nặng","Chỉ SpO₂","Chỉ chiều cao"],"why":"Theo TCC.docx: Nhiệt độ, mạch, CRT.","mode":"theory","key":53,"id":"q53"},{"t":2,"q":"Kiểu thở gợi ý toan chuyển hóa?","choices":["Thở nhanh sâu","Thở chậm nông","Thở rít thanh quản đơn độc","Ngưng thở sinh lý"],"why":"Theo TCC.docx: Thở nhanh sâu.","mode":"theory","key":54,"id":"q54"},{"t":2,"q":"Rối loạn Na máu có thể biểu hiện bằng?","choices":["Rối loạn tri giác, co giật","Đau tai đơn độc","Ho khan đơn độc","Hắt hơi"],"why":"Theo TCC.docx: Rối loạn tri giác, co giật.","mode":"theory","key":55,"id":"q55"},{"t":2,"q":"Dấu tim mạch gợi rối loạn K máu?","choices":["Rối loạn nhịp tim","Tiếng thổi cơ năng đơn độc","Mạch đều bình thường","Đau họng"],"why":"Theo TCC.docx: Rối loạn nhịp tim.","mode":"theory","key":56,"id":"q56"},{"t":2,"q":"Dấu cơ gợi hạ kali máu?","choices":["Yếu cơ, yếu chi","Tăng sức cơ","Cứng gáy đơn độc","Run khi lạnh đơn độc"],"why":"Theo TCC.docx: Yếu cơ, yếu chi.","mode":"theory","key":57,"id":"q57"},{"t":2,"q":"Dấu tiêu hóa gợi hạ kali máu?","choices":["Chướng bụng","Ăn ngon hơn","Ợ hơi đơn độc","Nuốt đau"],"why":"Theo TCC.docx: Chướng bụng.","mode":"theory","key":58,"id":"q58"},{"t":2,"q":"Phản xạ gân xương trong hạ kali theo tài liệu?","choices":["Giảm","Tăng luôn luôn","Không bao giờ đổi","Chỉ mất phản xạ đồng tử"],"why":"Theo TCC.docx: Giảm.","mode":"theory","key":59,"id":"q59"},{"t":2,"q":"Xét nghiệm đánh giá rối loạn Na, K?","choices":["Điện giải đồ","Cấy phân","X-quang ngực","Soi phân"],"why":"Theo TCC.docx: Điện giải đồ.","mode":"theory","key":60,"id":"q60"},{"t":2,"q":"Khoảng Na bình thường theo tài liệu?","choices":["135–145 mmol/L","130–140 mmol/L","120–135 mmol/L","145–155 mmol/L"],"why":"Theo TCC.docx: 135–145 mmol/L.","mode":"theory","key":61,"id":"q61"},{"t":2,"q":"Khoảng K bình thường theo tài liệu?","choices":["3,5–5,1 mmol/L","2–3,5 mmol/L","3–4 mmol/L","5,1–6,5 mmol/L"],"why":"Theo TCC.docx: 3,5–5,1 mmol/L.","mode":"theory","key":62,"id":"q62"},{"t":2,"q":"Khi trẻ tiêu chảy có triệu chứng thần kinh, phải nghĩ ngay biến chứng nào có thể xử trí được tại giường?","choices":["Hạ đường huyết","Thiếu sắt mạn","Dị ứng phấn hoa","Cận thị"],"why":"Theo TCC.docx: Hạ đường huyết.","mode":"theory","key":63,"id":"q63"},{"t":2,"q":"Xét nghiệm tức thời khi nghi hạ đường huyết?","choices":["Đường huyết mao mạch tại giường","HbA1c","Cấy máu trước mọi việc","Chờ glucose đói ngày hôm sau"],"why":"Theo TCC.docx: Đường huyết mao mạch tại giường.","mode":"theory","key":64,"id":"q64"},{"t":2,"q":"Nếu xác nhận hạ đường huyết thì làm gì theo tài liệu?","choices":["Điều trị ngay","Chờ đủ xét nghiệm khác","Chỉ hẹn tái khám","Không xử trí nếu tiêu chảy"],"why":"Theo TCC.docx: Điều trị ngay.","mode":"theory","key":65,"id":"q65"},{"t":2,"q":"Tổn thương thận cấp liên quan mất dịch: nguyên tắc điều trị nêu trong file?","choices":["Bù dịch và đánh giá tình trạng dịch","Hạn chế dịch tuyệt đối cho mọi trẻ","Dùng lợi tiểu cho mọi trẻ","Không đánh giá bài niệu"],"why":"Theo TCC.docx: Bù dịch và đánh giá tình trạng dịch.","mode":"theory","key":66,"id":"q66"},{"t":2,"q":"Ngưỡng pH được ghi là một tiêu chí xem xét bù toan tĩnh mạch?","choices":["<7,2","≤7,35","<7,0",">7,45"],"why":"Đây là mốc ghi trong tài liệu ôn, không phải chỉ định bicarbonate tự động; cần đánh giá nguyên nhân, tưới máu và phác đồ.","mode":"theory","key":67,"id":"q67"},{"t":2,"q":"Ngưỡng HCO₃⁻ được ghi cho xem xét bù toan tĩnh mạch?","choices":["<15 mEq/L","<22 mEq/L","<10 mEq/L",">25 mEq/L"],"why":"Mốc trong tài liệu ôn; chỉ định bicarbonate thực tế phụ thuộc nguyên nhân và tình trạng lâm sàng.","mode":"theory","key":68,"id":"q68"},{"t":2,"q":"Ngưỡng kali rất thấp được tài liệu nêu để cân nhắc bù tĩnh mạch?","choices":["<2 mmol/L","<3,5 mmol/L","<5,1 mmol/L",">5,1 mmol/L"],"why":"Bù K tĩnh mạch phải có chỉ định, kiểm soát tốc độ, ECG và chức năng thận; không tiêm tĩnh mạch trực tiếp.","mode":"theory","key":69,"id":"q69"},{"t":2,"q":"Ngưỡng Na rất thấp được ghi để cân nhắc bù tĩnh mạch?","choices":["<120 mmol/L","<135 mmol/L","<145 mmol/L",">150 mmol/L"],"why":"Không suy ra loại dịch hoặc tốc độ chỉnh Na chỉ từ ngưỡng này; đánh giá triệu chứng và phác đồ.","mode":"theory","key":70,"id":"q70"},{"t":2,"q":"Ngoài mức điện giải rất thấp, điều gì là tiêu chí tài liệu nêu để cân nhắc bù tĩnh mạch?","choices":["Có triệu chứng lâm sàng","Không có triệu chứng và điện giải bình thường","Chỉ vì nhà xa","Chỉ vì trẻ đủ tháng"],"why":"Theo TCC.docx: Có triệu chứng lâm sàng.","mode":"theory","key":71,"id":"q71"},{"t":3,"q":"Công thức máu bắt buộc theo tài liệu trong trường hợp nào?","choices":["Tiêu chảy cấp có chỉ định nhập viện","Tất cả trẻ tiêu một lần","Chỉ khi có sốc","Chỉ khi không sốt"],"why":"Theo TCC.docx: Tiêu chảy cấp có chỉ định nhập viện.","mode":"theory","key":72,"id":"q72"},{"t":3,"q":"Soi phân bắt buộc theo tài liệu trong trường hợp nào?","choices":["Tiêu chảy cấp có chỉ định nhập viện","Chỉ khi tiêu ≥14 ngày","Chỉ khi CRP >100","Chỉ khi có lồng ruột"],"why":"Theo TCC.docx: Tiêu chảy cấp có chỉ định nhập viện.","mode":"theory","key":73,"id":"q73"},{"t":3,"q":"Ngưỡng hồng cầu trong soi phân bất thường theo bảng?","choices":["≥1+","≥2+","≥3+","Chỉ khi 4+"],"why":"Theo TCC.docx: ≥1+.","mode":"theory","key":74,"id":"q74"},{"t":3,"q":"Ngưỡng bạch cầu trong soi phân bất thường theo bảng?","choices":["≥2+","≥1+","≥3+","Chỉ khi 4+"],"why":"Theo TCC.docx: ≥2+.","mode":"theory","key":75,"id":"q75"},{"t":3,"q":"Quan hệ giữa hai tiêu chí soi phân bất thường?","choices":["Hồng cầu ≥1+ HOẶC bạch cầu ≥2+","Cả hai bắt buộc cùng có","Hồng cầu ≥2+ VÀ bạch cầu ≥1+","Cả hai phải ≥3+"],"why":"Theo TCC.docx: Hồng cầu ≥1+ HOẶC bạch cầu ≥2+.","mode":"theory","key":76,"id":"q76"},{"t":3,"q":"Cấy phân được chỉ định khi nào?","choices":["Nghĩ nguyên nhân vi khuẩn","Chỉ khi đã khẳng định siêu vi","Chỉ khi phân bình thường","Không bao giờ chỉ định"],"why":"Theo TCC.docx: Nghĩ nguyên nhân vi khuẩn.","mode":"theory","key":77,"id":"q77"},{"t":3,"q":"Hai nhóm chỉ định CRP nêu trong tài liệu?","choices":["Trẻ sốt hoặc tiêu chảy cấp do vi khuẩn","Trẻ không sốt và phân bình thường","Chỉ vì trẻ bú mẹ","Chỉ khi đã khỏi"],"why":"Theo TCC.docx: Trẻ sốt hoặc tiêu chảy cấp do vi khuẩn.","mode":"theory","key":78,"id":"q78"},{"t":3,"q":"Mốc CRP tăng dùng trong cách biện luận của tài liệu?","choices":[">40 mg/L",">4 mg/L",">10 mg/L",">100 mg/L"],"why":"Đây là mốc định hướng trong tài liệu này, không phải khoảng tham chiếu CRP phổ quát.","mode":"theory","key":79,"id":"q79"},{"t":3,"q":"Mốc CRP phía dưới dùng trong tài liệu?","choices":["<40 mg/L","<5 mg/L","<100 mg/L","<20 mg/L"],"why":"Không đồng nhất ngưỡng định hướng này với giới hạn bình thường của labo; giá trị đúng 40 không được file quy định.","mode":"theory","key":80,"id":"q80"},{"t":3,"q":"Hai xét nghiệm sinh hóa được nêu để đánh giá chức năng thận?","choices":["Ure và creatinin","AST và ALT","Amylase và lipase","Bilirubin và albumin"],"why":"Theo TCC.docx: Ure và creatinin.","mode":"theory","key":81,"id":"q81"},{"t":3,"q":"Trẻ sốc, mất nước nặng hoặc nhiễm khuẩn huyết: nhóm xét nghiệm nào được nêu để đánh giá chức năng thận?", const $=id=>document.getElementById(id);
const storageKey='nhi-tieu-hoa-tcc-20261127-v1';
let storageOK=true;
let saved={stats:{},recent:[],light:false};
try{
  const previous=JSON.parse(localStorage.getItem(storageKey));
  if(previous?.stats && Array.isArray(previous.recent)) saved=previous;
  localStorage.setItem(storageKey,JSON.stringify(saved));
}catch{storageOK=false;}
function save(){
  try{localStorage.setItem(storageKey,JSON.stringify(saved));}
  catch{storageOK=false;}
}
function el(tag,value){
  const node=document.createElement(tag);
  if(value!==undefined)node.textContent=value;
  return node;
}
function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}
topics.forEach((name,i)=>{
  const option=el('option',name);
  option.value=i;
  $('topic').append(option);
});
$('reference').append(el('p','Tài liệu TCC.docx có bảng trùng, lỗi đơn vị và một số ô thiếu hoặc mơ hồ. Không học thuộc 75 mL/kg/giờ của phác đồ B; ví dụ trong file cho 75 mL/kg tổng trong 4 giờ. Mốc đường huyết 70 mg/L sai đơn vị khả nghi, không đưa vào đáp án. CRP 40 mg/L là mốc định hướng theo tài liệu, không phải khoảng tham chiếu chung. File không nêu đầy đủ cách chia 100 mL/kg phác đồ C theo tuổi; không tự thêm. Một số mục thuốc có lỗi chữ hoặc thiếu mẫu số liều (ceftriaxone), ví dụ ciprofloxacin 14 kg không khớp phép tính, và chỉ định kháng sinh IV theo CRP >100 không đủ để áp dụng đơn độc; không biến các dòng đó thành y lệnh. Các chỉ định bù toan, điện giải, truyền dịch và thuốc phải đối chiếu phác đồ hiện hành.'));function theme(){
  document.documentElement.classList.toggle('light',saved.light);
  $('theme').textContent=saved.light?'Giao diện tối':'Giao diện sáng';
}
$('theme').onclick=()=>{saved.light=!saved.light;save();theme();};
theme();
let mode="theory";
let round=[],position=0,pending=[],repeated=new Set(),missed=[],correct=0,answered=false,baseCount=0,reviewCount=0,current;
const weak=id=>saved.stats[id]?.debt||0;
function inScope(q){
  return q.mode===mode&&($('topic').value===''||String(q.t)===$('topic').value);
}
function switchMode(value){
  mode=value;
  $('theory').setAttribute('aria-pressed',String(mode==='theory'));
  $('cases').setAttribute('aria-pressed',String(mode==='case'));
  $('phase').textContent=mode==='theory'
    ? 'Mỗi câu hỏi một ý trong tài liệu. Chọn Toàn bộ để rà đủ nội dung đã soạn.'
    : 'Áp dụng lý thuyết vào tình huống lâm sàng và tính dịch.';
  $('length').value=mode==='theory'?'all':'20';
  buildRound(false);
}
function status(){
  const count=bank.filter(inScope).length;
  $('status').textContent=count+' câu trong phạm vi chọn · '+new Set(bank.filter(q=>inScope(q)&&weak(q.id)>0).map(q=>q.id)).size+' mốc cần ôn lại'+(storageOK?'':' · Tiến độ chỉ lưu trong phiên này');
}
function buildRound(review){
  const pool=shuffle(bank.filter(q=>inScope(q)&&(!review||weak(q.id)>0)));
  if(!pool.length){
    $('status').textContent='Chưa có mốc hay sai trong chủ đề đang chọn.';
    return;
  }
  const recent=new Set(saved.recent);
  const groups=new Map();
  pool.forEach(q=>{
    if(!groups.has(q.id))groups.set(q.id,[]);
    groups.get(q.id).push(q);
  });
  const ordered=[...groups.values()].sort((a,b)=>weak(b[0].id)-weak(a[0].id));
  const want=$('length').value==='all'?pool.length:Math.min(Number($('length').value),pool.length);
  round=[];
  const used=new Set();
  // Sample each group once before returning to it. Prefer stems absent from the previous round.
  for(const excludeRecent of [true,false]){
    let added=true;
    while(added&&round.length<want){
      added=false;
      for(const group of ordered){
        const q=group.find(item=>!used.has(item.key)&&(!excludeRecent||!recent.has(item.key)));
        if(!q)continue;
        round.push({q,isReview:false});used.add(q.key);added=true;
        if(round.length===want)break;
      }
    }
  }
  saved.recent=round.map(item=>item.q.key);
  save();
  baseCount=round.length;position=0;correct=0;reviewCount=0;pending=[];missed=[];repeated=new Set();
  $('results').hidden=true;
  $('quiz').hidden=false;
  status();
  show(false);
}
function show(focus=true){
  current=round[position];
  answered=false;
  const {q,isReview}=current;
  $('counter').textContent=isReview?'Ôn lại mốc vừa sai':'Câu '+round.slice(0,position+1).filter(x=>!x.isReview).length+' / '+baseCount;
  $('tag').textContent=topics[q.t];
  $('progress').max=baseCount;
  $('progress').value=round.slice(0,position).filter(x=>!x.isReview).length;
  $('question').textContent=q.q;
  $('feedback').hidden=true;
  $('next').hidden=true;
  $('answers').replaceChildren();
  shuffle(q.choices.map((value,i)=>({value,isCorrect:i===0}))).forEach(({value,isCorrect},i)=>{
    const button=el('button');
    button.type='button';
    button.append(el('b','ABCD'[i]),el('span',value));
    button.dataset.correct=String(isCorrect);
    button.onclick=()=>answer(button);
    $('answers').append(button);
  });
  if(focus)$('question').focus();
}
function answer(button){
  if(answered)return;
  answered=true;
  const {q,isReview}=current;
  const hit=button.dataset.correct==='true';
  const item=saved.stats[q.id]||{debt:0};
  item.debt=hit?Math.max(0,item.debt-1):Math.min(6,item.debt+2);
  saved.stats[q.id]=item;
  save();
  status();
  if(!isReview&&hit)correct++;
  if(isReview&&hit)reviewCount++;
  if(!hit){
    missed.push({q,chosen:button.lastChild.textContent});
    if(!repeated.has(q.id)){
      repeated.add(q.id);
      const unavailable=new Set([...round.map(item=>item.q.key),...pending.map(item=>item.q.key)]);
      const alternatives=shuffle(bank.filter(other=>other.mode===mode&&other.id===q.id&&other.key!==q.key));
      const practice=alternatives.find(other=>!unavailable.has(other.key))||alternatives[0]||q;
      pending.push({q:practice,isReview:true,due:position+4});
    }
  }
  [...$('answers').children].forEach(option=>{
    option.disabled=true;
    if(option.dataset.correct==='true')option.classList.add('right');
    else if(option===button)option.classList.add('wrong');
  });
  $('feedback').replaceChildren(el('strong',hit?'Đúng rồi':'Chưa đúng · '+q.choices[0]),el('p',q.why));
  $('feedback').hidden=false;
  $('next').textContent=position===round.length-1&&!pending.length?'Xem kết quả':'Câu tiếp';
  $('next').hidden=false;
}
function next(){
  if(!answered)return;
  const i=pending.findIndex(item=>item.due<=position+1);
  if(i>=0||position===round.length-1&&pending.length){
    const [item]=pending.splice(i<0?0:i,1);
    round.splice(position+1,0,item);
  }
  position++;
  if(position<round.length){show();return;}
  $('quiz').hidden=true;
  $('results').hidden=false;
  const heading=el('h2',correct+'/'+baseCount+' câu đúng trong đề');
  heading.tabIndex=-1;
  $('results').replaceChildren(heading,el('p','Lượt ôn xen kẽ: '+reviewCount+'/'+(round.length-baseCount)+' câu đúng.'));
  if(missed.length){
    const details=el('details');
    details.append(el('summary','Xem '+missed.length+' lượt trả lời sai'));
    missed.forEach(({q,chosen})=>details.append(el('h2',q.q),el('p','Em chọn: '+chosen+' · Đáp án: '+q.choices[0]),el('p',q.why)));
    $('results').append(details);
  }
  const again=el('button','Làm đề mới');
  again.className='primary';
  again.onclick=()=>buildRound(false);
  $('results').append(again);
  if(mode==='theory'){
    const cases=el('button','Sang lượt làm case');
    cases.onclick=()=>switchMode('case');
    $('results').append(cases);
  }
  heading.focus();
}
$('theory').onclick=()=>switchMode('theory');
$('cases').onclick=()=>switchMode('case');
$('start').onclick=()=>buildRound(false);
$('retry').onclick=()=>buildRound(true);
$('topic').onchange=status;
$('next').onclick=next;
document.addEventListener('keydown',event=>{
  if($('quiz').hidden||event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
  if(event.target.closest?.('select,input,textarea,button,summary'))return;
  const key=event.key.toLowerCase();
  if(answered&&key==='enter'){event.preventDefault();next();return;}
  if(answered||!key||key.length!==1)return;
  const index='abcd'.includes(key)?'abcd'.indexOf(key):'1234'.indexOf(key);
  if(index>=0){event.preventDefault();$('answers').children[index].click();}
});
switchMode('theory');
</script></html>
